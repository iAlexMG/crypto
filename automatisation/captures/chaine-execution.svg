<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="Le runner d'automatisation crypto et ses échanges : il lit les données Binance, pilote et écoute la démo Bitget, et journalise chaque décision">
  <defs>
    <marker id="fl" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A6D2F"/></marker>
    <marker id="tl" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3d6b78"/></marker>
    <marker id="fd" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#2b3444"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="469" rx="16" fill="#0b0e14" stroke="#1F2630"/>

  <text x="30" y="36" fill="#E6EDF3" font-family="monospace" font-size="16">Le runner et ses échanges</text>
  <text x="30" y="56" fill="#5b6678" font-family="monospace" font-size="11">L'application au centre : elle lit Binance, pilote et écoute la démo Bitget, puis journalise chaque décision.</text>

  <!-- ===== BINANCE (source de données, gauche) ===== -->
  <rect x="40" y="150" width="176" height="100" rx="10" fill="#12161C" stroke="#1F2630"/>
  <rect x="40" y="150" width="176" height="3" rx="1.5" fill="#f0b90b"/>
  <text x="56" y="178" fill="#f0b90b" font-family="monospace" font-size="13">Binance</text>
  <text x="56" y="200" fill="#8B949E" font-family="monospace" font-size="10">marché de référence</text>
  <text x="56" y="218" fill="#8B949E" font-family="monospace" font-size="10">données 1 m (klines)</text>
  <text x="56" y="236" fill="#8B949E" font-family="monospace" font-size="10">d'où naît le signal</text>

  <!-- ===== RUNNER (le hero, centre) ===== -->
  <rect x="316" y="126" width="268" height="170" rx="12" fill="#12161C" stroke="#8A6D2F" stroke-width="1.5"/>
  <rect x="316" y="126" width="268" height="3" rx="1.5" fill="#E3B341"/>
  <text x="332" y="154" fill="#E3B341" font-family="monospace" font-size="14">Le runner</text>
  <text x="332" y="172" fill="#8B949E" font-family="monospace" font-size="10">l'orchestrateur — l'application</text>
  <rect x="332" y="182" width="236" height="28" rx="6" fill="#171D26" stroke="#1F2630"/>
  <text x="344" y="200" fill="#C9D3DE" font-family="monospace" font-size="9.5">moteur hybride — SMA 3/9 · ATR</text>
  <rect x="332" y="216" width="236" height="28" rx="6" fill="#171D26" stroke="#1F2630"/>
  <text x="344" y="234" fill="#C9D3DE" font-family="monospace" font-size="9.5">H1 bracket · H2 suiveur · H3 annule</text>
  <rect x="332" y="250" width="236" height="28" rx="6" fill="#171D26" stroke="#1F2630"/>
  <text x="344" y="268" fill="#C9D3DE" font-family="monospace" font-size="9.5">garde-fou dislocation (basis)</text>

  <!-- ===== BITGET (exécution + serveur, droite) ===== -->
  <rect x="684" y="150" width="176" height="126" rx="10" fill="#12161C" stroke="#1F2630"/>
  <rect x="684" y="150" width="176" height="3" rx="1.5" fill="#00d3a7"/>
  <text x="700" y="178" fill="#00d3a7" font-family="monospace" font-size="13">Bitget démo</text>
  <text x="700" y="198" fill="#8B949E" font-family="monospace" font-size="10">exécution (paptrading)</text>
  <line x1="700" y1="210" x2="844" y2="210" stroke="#1F2630"/>
  <text x="700" y="230" fill="#8B949E" font-family="monospace" font-size="9.5">serveur : il tient le</text>
  <text x="700" y="246" fill="#8B949E" font-family="monospace" font-size="9.5">bracket et exécute</text>
  <text x="700" y="262" fill="#8B949E" font-family="monospace" font-size="9.5">SL / TP + le suiveur</text>

  <!-- ===== échanges ===== -->
  <!-- Binance -> Runner : données -->
  <line x1="216" y1="200" x2="313" y2="200" stroke="#8A6D2F" stroke-width="1.5" marker-end="url(#fl)"/>
  <text x="264" y="192" fill="#8B949E" font-family="monospace" font-size="8.5" text-anchor="middle">données 1 m</text>

  <!-- Runner <-> Bitget : deux flux -->
  <line x1="585" y1="183" x2="682" y2="183" stroke="#8A6D2F" stroke-width="1.5" marker-end="url(#fl)"/>
  <text x="633" y="165" fill="#E3B341" font-family="monospace" font-size="8.5" text-anchor="middle">ordre + bracket</text>
  <text x="633" y="176" fill="#8A6D2F" font-family="monospace" font-size="8" text-anchor="middle">suiveur &#8593; · kill</text>
  <line x1="682" y1="243" x2="585" y2="243" stroke="#3d6b78" stroke-width="1.5" marker-end="url(#tl)"/>
  <text x="633" y="258" fill="#7f9aa6" font-family="monospace" font-size="8" text-anchor="middle">position · fill · SL/TP touché</text>

  <!-- Runner -> Journal -->
  <line x1="450" y1="296" x2="450" y2="343" stroke="#2b3444" stroke-width="1.2" marker-end="url(#fd)"/>
  <text x="458" y="324" fill="#5b6678" font-family="monospace" font-size="8.5">journalise</text>

  <!-- ===== JOURNAL (bas, centré sous le runner) ===== -->
  <rect x="352" y="346" width="196" height="80" rx="10" fill="#12161C" stroke="#1F2630"/>
  <text x="368" y="372" fill="#8A6D2F" font-family="monospace" font-size="12">Journal NDJSON</text>
  <text x="368" y="392" fill="#8B949E" font-family="monospace" font-size="10">signal · entrée ·</text>
  <text x="368" y="410" fill="#8B949E" font-family="monospace" font-size="10">stop_modifié · sortie</text>

  <!-- pied -->
  <text x="30" y="452" fill="#5b6678" font-family="monospace" font-size="10">Démo Bitget uniquement · garde codée en dur (aucun ordre réel) · une position à la fois · kill switch Ctrl-C.</text>
</svg>
